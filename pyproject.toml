[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "streamdock-n3-linux"
version = "0.2.5"
description = "Local-first AI productivity console for the Mirabox Stream Dock N3 on Linux."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Asad Al Badi", email = "asad.badi@vodafone.om" },
]
maintainers = [
    { name = "jincai822" },
]
keywords = ["ai", "automation", "streamdock", "n3", "mirabox", "linux", "hid", "gtk4", "productivity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "evdev>=1.9.3",
    "pillow>=12.3.0",
    "pyudev>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/jincai822/n3-ai-deck"
Repository = "https://github.com/jincai822/n3-ai-deck"
Issues = "https://github.com/jincai822/n3-ai-deck/issues"
Changelog = "https://github.com/jincai822/n3-ai-deck/blob/main/CHANGELOG.md"
Upstream = "https://github.com/asad-albadi/streamdock-n3"

[project.scripts]
n3-ai-deck-detect = "streamdock_n3.discovery:main"
n3-ai-deck-observe-inputs = "streamdock_n3.input_cli:main"
n3-ai-deck-run-action = "streamdock_n3.actions.cli:main"
streamdock-n3 = "streamdock_n3.daemon:main"
streamdock-n3-gui = "streamdock_n3.gui:main"
streamdock-n3-debug = "streamdock_n3.debug_tool:main"
streamdock-n3-probe = "streamdock_n3.probe:main"
streamdock-n3-install = "streamdock_n3.system_install:main"

[tool.hatch.build.targets.wheel]
packages = ["src/streamdock_n3"]
# _data and _vendor live inside the package and are picked up automatically.
# Re-include the .dll/.so transports that hatchling otherwise filters.
artifacts = [
    "src/streamdock_n3/_vendor/StreamDock/Transport/TransportDLL/*.dll",
    "src/streamdock_n3/_vendor/StreamDock/Transport/TransportDLL/*.lib",
    "src/streamdock_n3/_vendor/StreamDock/Transport/TransportDLL/*.so",
    "src/streamdock_n3/_vendor/StreamDock/Transport/TransportDLL/*.dylib",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/streamdock_n3",
    "tests",
    "README.md",
    "README.zh-CN.md",
    "ROADMAP.md",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "ACKNOWLEDGEMENTS.md",
    "docs/ARCHITECTURE.md",
    "CHANGELOG.md",
    "LICENSE",
    "Makefile",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/streamdock_n3/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # handled by formatter
    "B008",   # GTK callbacks legitimately use mutable defaults in places
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["src/streamdock_n3/_vendor/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
